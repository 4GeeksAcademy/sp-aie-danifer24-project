services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    networks:
      - nexova

  flower:
    image: mher/flower:2.0
    command: ["celery", "--broker=redis://redis:6379/0", "--result-backend=redis://redis:6379/0", "flower", "--port=5555"]
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      - redis
    ports:
      - "5555:5555"
    networks:
      - nexova

  api:
    build:
      context: ./services
      dockerfile: Dockerfile
      additional_contexts:
        repo: .
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      DATABASE_URL: ${DATABASE_URL:?Define DATABASE_URL en el archivo .env o en el entorno}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Define JWT_SECRET_KEY en el archivo .env}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:?}
      SUPPLIERS_DB_PATH: ${SUPPLIERS_DB_PATH:?}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      PASSWORD_RESET_URL: ${PASSWORD_RESET_URL:?}
    command: ["uvicorn", "services.api.main:app", "--host", "0.0.0.0", "--port", "${API_PORT:?}", "--reload"]
    depends_on:
      - redis
    ports:
      - "${API_PORT:?}:${API_PORT:?}"
    volumes:
      - ./services:/app/services
      - ./packages/shared:/app/packages/shared:ro
      - ./docs:/app/docs:ro
      - api-data:/app/data
    networks:
      - nexova

  worker:
    build:
      context: ./services
      dockerfile: Dockerfile
      additional_contexts:
        repo: .
    command: ["celery", "-A", "services.celery_app:celery_app", "worker", "--loglevel=INFO"]
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      DATABASE_URL: ${DATABASE_URL:?Define DATABASE_URL en el archivo .env o en el entorno}
      JOB_RUNS_DATABASE_URL: ${JOB_RUNS_DATABASE_URL:-}
      TELEMETRY_DATABASE_URL: ${TELEMETRY_DATABASE_URL:-}
      TELEMETRY_DATABASE_READ_ONLY: ${TELEMETRY_DATABASE_READ_ONLY:-false}
      REPORTING_DATABASE_URL: ${REPORTING_DATABASE_URL:-${DATABASE_URL:?Define DATABASE_URL en el archivo .env o en el entorno}}
    depends_on:
      - redis
    restart: unless-stopped
    volumes:
      - ./services:/app/services
      - ./packages/shared:/app/packages/shared:ro
    networks:
      - nexova

  uis:
    build:
      context: ./uis
      dockerfile: Dockerfile
      additional_contexts:
        repo: .
      args:
        NEXT_PUBLIC_INVENTORY_API_URL: ${NEXT_PUBLIC_INVENTORY_API_URL:-http://api:${API_PORT:?}}
    depends_on:
      - api
    init: true
    command: ["bash", "/app/uis/start.sh"]
    environment:
      NODE_ENV: ${NODE_ENV:?}
      NEXTJS_MODE: ${NEXTJS_MODE:?}
      WEBSITE_PORT: ${WEBSITE_PORT:?}
      BACKOFFICE_PORT: ${BACKOFFICE_PORT:?}
      INVENTORY_API_URL: http://api:${API_PORT:?}
      NEXT_PUBLIC_INVENTORY_API_URL: ${NEXT_PUBLIC_INVENTORY_API_URL:?}
      SUPPLIERS_API_URL: http://api:${API_PORT:?}
      TELEMETRY_ENDPOINT: http://api:${API_PORT}/telemetry/events
    ports:
      - "${WEBSITE_PORT:?}:${WEBSITE_PORT:?}"
      - "${BACKOFFICE_PORT:?}:${BACKOFFICE_PORT:?}"
    volumes:
      - ./uis:/app/uis
      - ./packages/shared:/app/packages/shared:ro
      - ./src:/app/src:ro
      - website-dependencies:/app/uis/website/node_modules
      - backoffice-dependencies:/app/uis/backoffice/node_modules
      - website-next:/app/uis/website/.next
      - backoffice-next:/app/uis/backoffice/.next
    networks:
      - nexova

volumes:
  api-data:
  website-dependencies:
  backoffice-dependencies:
  website-next:
  backoffice-next:

networks:
  nexova:
    name: ${DOCKER_NETWORK_NAME:?}