<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f3f6f2" />
    <title>Iniciar sesión | Nexova</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/login.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/" aria-label="Nexova, inicio">
        <span class="brand-mark" aria-hidden="true">N</span>
        <span>NEXOVA</span>
      </a>
      <span class="topbar-context">OPERACIONES · SOPORTE</span>
    </header>
    <main class="auth-workspace">
      <section class="auth-panel" aria-labelledby="login-title">
        <p class="eyebrow">ACCESO AL ESPACIO DE TRABAJO</p>
        <h1 id="login-title">Inicia sesión</h1>
        <p class="lede">Accede al análisis de incidencias de Nexova.</p>
        <form class="auth-form" id="login-form">
          <label for="login-email">Correo electrónico
            <input id="login-email" name="email" type="email" autocomplete="email" required />
          </label>
          <label for="login-password">Contraseña
            <input id="login-password" name="password" type="password" autocomplete="current-password" required />
          </label>
          <p class="auth-error" id="login-error" role="alert" hidden></p>
          <button class="button button-primary" id="login-submit" type="submit">Entrar</button>
        </form>
      </section>
    </main>
  </body>
</html>
