[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexova-suppliers"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "celery>=5.7.0",
    "fastmcp>=4.1.8",
    "flower>=2.2.0",
    "grpcio>=1.85.1",
    "jsonschema[format]>=4.23,<5.0",
    "langchain-mcp-adapters>=0.3.1",
    "langgraph>=1.2.22",
    "libpass[bcrypt]>=1.9.3",
    "markitdown[pdf]>=0.1.9",
    "matplotlib>=3.10.9",
    "mcpauth>=0.1.1",
    "openai>=3.49.0",
    "pandas>=2.2,<4.0",
    "prefect>=3",
    "psycopg2-binary>=2.9.13",
    "py-readability-metrics>=1.4.5",
    "pydantic>=2.0,<3.0",
    "python-dotenv>=1.0,<2.0",
    "python-jose[cryptography]>=3.5.0",
    "qdrant-client>=1.20.0",
    "redis>=8.1.0",
    "scikit-learn>=1.7.2",
    "sqlmodel>=0.0.48",
    "tinydb>=4.8,<5.0",
]

[project.scripts]
seed = "services.api.seed:main"
business-performance-pipeline = "data.pipelines.pipeline:main"

[tool.hatch.build.targets.wheel]
packages = ["services", "data", "mcps"]

[dependency-groups]
rag = [
    "openai>=1.0,<4.0",
    "qdrant-client>=1.20.0",
]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "python-multipart>=0.0.32",
]
