[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexova-suppliers"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "libpass[bcrypt]>=1.9.3",
    "pydantic>=2.0,<3.0",
    "python-jose[cryptography]>=3.5.0",
    "tinydb>=4.8,<5.0",
]

[project.scripts]
seed = "services.api.seed:main"

[tool.hatch.build.targets.wheel]
packages = ["services"]
